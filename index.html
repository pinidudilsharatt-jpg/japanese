<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Japanese Study Companion Pro</title>
    <style>
        *{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:0;user-select:none;-webkit-user-select:none}
        body{background-color:#f6f7fb;color:#333;display:flex;flex-direction:column;align-items:center;padding:15px}
        h1{margin:15px 0 5px 0;color:#4257b2;font-size:22px;text-align:center}
        p.subtitle{font-size:13px;color:#666;margin-bottom:20px}
        .container{width:100%;max-width:450px;text-align:center}
        .nav-buttons{margin-bottom:20px;display:flex;gap:8px}
        button{flex:1;background-color:#4257b2;color:#fff;border:none;padding:12px 8px;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.1)}
        button:active{transform:scale(.97)}
        button.secondary{background-color:#fff;color:#4257b2;border:2px solid #4257b2;padding:10px 8px}
        button.admin-btn{background-color:#eef2ff;color:#4257b2;border:2px solid #4257b2;box-shadow:0 2px 8px rgba(66,87,178,.15)}
        button.admin-btn:active{background-color:#4257b2;color:#fff}
        .admin-view,.card-view,.quiz-view{background:#fff;padding:20px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.05);min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;margin-bottom:20px;width:100%}
        .admin-view{justify-content:flex-start;align-items:stretch;text-align:left}
        .flashcard{width:100%;height:220px;perspective:1000px;cursor:pointer}
        .card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s}
        .flashcard.flipped .card-inner{transform:rotateY(180deg)}
        .card-back,.card-front{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;justify-content:center;align-items:center;font-size:28px;font-weight:600;border-radius:12px;border:2px solid #e2e8f0;padding:15px;box-shadow:0 4px 6px rgba(0,0,0,.02);text-align:center}
        .card-front{background-color:#fff;color:#333}
        .card-back{background-color:#4257b2;color:#fff;transform:rotateY(180deg);font-size:22px}
        .controls{display:flex;justify-content:space-between;align-items:center;margin-top:20px;width:100%}
        .controls button{flex:none;width:95px;padding:10px}
        .hidden{display:none!important}
        .quiz-question{font-size:18px;font-weight:600;margin-bottom:20px;color:#2d3748;line-height:1.4}
        .options-grid{display:flex;flex-direction:column;gap:10px;width:100%}
        .option-btn{background-color:#f0f2ff;color:#333;border:2px solid #cfd5ff;padding:14px;font-size:15px;font-weight:500;border-radius:10px;text-align:center;width:100%;box-shadow:none;cursor:pointer}
        .feedback{font-size:16px;font-weight:700;margin-top:15px;min-height:22px}
        .correct{color:#2e7d32}
        .wrong{color:#c62828}
        .score-text{font-size:22px;font-weight:700;color:#2e7d32;margin-top:10px}
        .form-group{margin-bottom:15px;width:100%}
        .form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:#4a5568}
        .form-group input{width:100%;padding:12px;font-size:15px;border:2px solid #cbd5e0;border-radius:8px;outline:none;user-select:text!important;-webkit-user-select:text!important}
        .form-group input:focus{border-color:#4257b2}
        .section-title{font-size:16px;font-weight:700;color:#4257b2;margin:15px 0 10px 0;border-bottom:2px solid #e2e8f0;padding-bottom:5px}
        .word-list-container{max-height:300px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:5px;background:#f8fafc}
        .word-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #e2e8f0;font-size:14px;background:#fff;margin-bottom:4px;border-radius:6px;text-align:left}
        .word-item:last-child{border-bottom:none;margin-bottom:0}
        .word-info{flex:1;padding-right:10px}
        .word-jp{font-weight:700;color:#333;font-size:15px}
        .word-si{color:#666;font-size:13px;margin-top:2px;display:inline-block}
        .delete-btn{background-color:#ef4444;color:#fff;padding:6px 12px;font-size:11px;border-radius:6px;width:auto;flex:none;box-shadow:none}
        .empty-text{text-align:center;color:#a0aec0;padding:15px;font-size:13px}
        .backup-buttons{display:flex;gap:10px;margin-top:15px}
        .backup-buttons button{background-color:#718096;font-size:12px;padding:8px}
        .wrong-words-container{background:#fff;padding:15px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.05);width:100%;text-align:left;margin-top:20px}
        .wrong-word-item{border-left:4px solid #ef4444;background-color:#fffafb}
        .wrong-word-item .word-jp{color:#c62828}
        .wrong-counter{background-color:#ef4444;color:#fff;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:700}
        .clear-wrong-btn{background-color:#ef4444!important;color:#fff!important;padding:5px 10px!important;font-size:11px!important;border-radius:6px!important;font-weight:400!important;width:auto!important;flex:none!important;box-shadow:none!important}
    </style>
</head>
<body>

    <h1>ජපන් භාෂා සහකරු</h1>
    <p class="subtitle">Flashcards & Quiz App (Pro)</p>

    <div class="container">
        <div class="nav-buttons">
            <button id="show-cards-btn" onclick="switchView('cards')">Flashcards</button>
            <button id="show-quiz-btn" class="secondary" onclick="switchView('quiz')">Start Quiz</button>
            <button id="show-admin-btn" class="admin-btn" onclick="switchView('admin')">වචන එකතු කරන්න ➕</button>
        </div>

        <div id="flashcard-section" class="card-view">
            <div class="flashcard" onclick="toggleFlip()">
                <div class="card-inner">
                    <div class="card-front" id="front-text">Japanese Word</div>
                    <div class="card-back" id="back-text">සිංහල තේරුම</div>
                </div>
            </div>
            <div class="controls">
                <button onclick="prevCard()">◀ පසුපසට</button>
                <span id="card-indicator" style="font-weight:bold;color:#555">1 / 110</span>
                <button onclick="nextCard()">ඉදිරියට ▶</button>
            </div>
        </div>

        <div id="quiz-section" class="quiz-view hidden">
            <div id="quiz-game" style="width:100%">
                <div class="quiz-question" id="quiz-question-text">ප්‍රශ්නය මෙතනට...</div>
                <div class="options-grid" id="options-container"></div>
                <div id="quiz-feedback" class="feedback"></div>
            </div>
            <div id="quiz-result" class="hidden" style="width:100%">
                <p class="quiz-question">ප්‍රශ්නාවලිය අවසන්! 🎉</p>
                <p id="score-display" class="score-text">ලකුණු: 0/0</p>
                <button onclick="startQuiz()" style="margin-top:25px;width:160px;display:inline-block">නැවත උත්සාහ කරන්න</button>
            </div>
            <div id="quiz-wrong-section" class="wrong-words-container">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:2px solid #fed7d7;padding-bottom:5px">
                    <h3 style="color:#c62828;font-size:15px;display:flex;align-items:center;gap:8px">
                        <span>වැරදුණු වචන ලැයිස්තුව</span>
                        <span id="wrong-count-badge" class="wrong-counter">0</span>
                    </h3>
                    <button class="clear-wrong-btn" onclick="clearWrongWordsList()">ලැයිස්තුව මකන්න 🗑️</button>
                </div>
                <div id="wrong-words-list" class="word-list-container" style="max-height:180px">තවම වැරදුණු වචන නැත.</div>
            </div>
        </div>

        <div id="admin-section" class="admin-view hidden">
            <h3 style="font-size:15px;margin-bottom:15px;color:#4257b2;text-align:center;font-weight:bold">නව වචන ඇතුළත් කිරීමේ පුවරුව</h3>
            <div class="form-group">
                <label>ජපන් වචනය (හිරගනා / කටකනා / கන්ජි):</label>
                <input type="text" id="input-term" placeholder="උදා: ありがとう">
            </div>
            <div class="form-group">
                <label>සිංහල තේරුම:</label>
                <input type="text" id="input-definition" placeholder="උදා: ස්තූතියි">
            </div>
            <button onclick="addNewWord()" style="background-color:#4257b2;margin-bottom:15px;width:100%">වචනය සුරකින්න (Save Word)</button>
            <div class="section-title">දැනට පවතින වචන ලැයිස්තුව (<span id="total-words-count">0</span>)</div>
            <div class="word-list-container" id="word-list-container"></div>
            <div class="backup-buttons">
                <button onclick="exportWords()">Backup (Export JSON)</button>
                <button onclick="document.getElementById('import-file').click()">Restore (Import JSON)</button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importWords(event)">
            </div>
        </div>
    </div>
